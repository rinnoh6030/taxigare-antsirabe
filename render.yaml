services:
  - type: web
    name: taxigare-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./gare.db
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 720
      - key: ANNULATION_DELAI_HEURES
        value: 2
      - key: FRONTEND_URL
        fromService:
          type: web
          name: taxigare-frontend
          property: host
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: taxigare-frontend
          property: host

  - type: web
    name: taxigare-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: taxigare-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
